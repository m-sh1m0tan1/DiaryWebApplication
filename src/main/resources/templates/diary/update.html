<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('日記を編集')}"></head>

<body class="diary-create">
    <div th:replace="~{layout :: header}"></div>
    <main class="diary-create-main">
        <header class="diary-create-heading">
            <div class="diary-create-heading__top">
                <div>
                    <p class="diary-create-heading__eyebrow">一日の記録</p>
                    <h1 id="diary-update-title">日記を編集</h1>
                </div>
                <a class="diary-back-button"
                   th:href="@{/diary/detail/{diaryId}(diaryId=${diary.id})}">詳細へ戻る</a>
            </div>
            <p>記録した内容を見直して、必要なところを更新できます。</p>
        </header>

        <p class="error-message" th:if="${error}" th:text="${error}" role="alert"></p>

        <form class="diary-form"
              th:action="@{/diary/update/{diaryId}(diaryId=${diary.id})}"
              method="post"
              th:object="${diaryForm}"
              aria-labelledby="diary-update-title">
            <div class="error-message" th:if="${#fields.hasErrors('*')}"
                 th:errors="*{all}" role="alert"></div>

            <section class="diary-form__section" aria-labelledby="diary-update-context-heading">
                <div class="diary-form__section-heading">
                    <h2 id="diary-update-context-heading">記録の基本情報</h2>
                    <p>日付は変更できません。気分は更新できます。</p>
                </div>
                <div class="diary-form__row">
                    <div class="diary-form__field">
                        <span class="diary-form__label" id="diaryDate-label">日付</span>
                        <time class="diary-form__date" th:datetime="${diary.diaryDate}"
                              th:text="${#temporals.format(diary.diaryDate, 'yyyy年M月d日')}">2026年1月1日</time>
                        <input type="hidden" th:field="*{diaryDate}">
                    </div>
                    <div class="diary-form__field">
                        <label for="currentMood">
                            気分 <span class="diary-form__requirement diary-form__requirement--required">必須</span>
                        </label>
                        <select id="currentMood" th:field="*{currentMood}" required
                                th:attr="aria-invalid=${#fields.hasErrors('currentMood')}, aria-describedby=${#fields.hasErrors('currentMood')} ? 'currentMood-error' : null">
                            <option value="">選択してください</option>
                            <option value="GOOD">良い</option>
                            <option value="NORMAL">普通</option>
                            <option value="BAD">悪い</option>
                        </select>
                        <span class="diary-form__help" id="currentMood-error" th:if="${#fields.hasErrors('currentMood')}"
                              th:errors="*{currentMood}" role="alert"></span>
                    </div>
                </div>
            </section>

            <section class="diary-form__section" aria-labelledby="diary-update-entry-heading">
                <div class="diary-form__section-heading">
                    <h2 id="diary-update-entry-heading">日記の本文</h2>
                    <p>タイトルや本文を編集できます。</p>
                </div>
                <div class="diary-form__field">
                    <label for="title">タイトル <span class="diary-form__requirement">任意</span></label>
                    <input type="text" id="title" th:field="*{title}" maxlength="255">
                </div>
                <div class="diary-form__field">
                    <label for="content">
                        本文 <span class="diary-form__requirement diary-form__requirement--required">必須</span>
                    </label>
                    <textarea id="content" th:field="*{content}" rows="8" required
                              th:attr="aria-invalid=${#fields.hasErrors('content')}, aria-describedby=${#fields.hasErrors('content')} ? 'content-error' : null"></textarea>
                    <span class="diary-form__help" id="content-error" th:if="${#fields.hasErrors('content')}"
                          th:errors="*{content}" role="alert"></span>
                </div>
            </section>

            <section class="diary-form__section" aria-labelledby="diary-update-reflection-heading">
                <div class="diary-form__section-heading">
                    <h2 id="diary-update-reflection-heading">明日につなげるメモ</h2>
                    <p>良かったことや、明日に残しておきたいことを記録できます。</p>
                </div>
                <div class="diary-form__row">
                    <div class="diary-form__field">
                        <label for="goodThings">良かったこと <span class="diary-form__requirement">任意</span></label>
                        <textarea id="goodThings" th:field="*{goodThings}" rows="3"></textarea>
                    </div>
                    <div class="diary-form__field">
                        <label for="tomorrowNote">明日へのメモ <span class="diary-form__requirement">任意</span></label>
                        <textarea id="tomorrowNote" th:field="*{tomorrowNote}" rows="3"></textarea>
                    </div>
                </div>
            </section>

            <div class="diary-form__actions">
                <button type="submit">変更を保存</button>
                <a class="diary-back-button"
                   th:href="@{/diary/detail/{diaryId}(diaryId=${diary.id})}">キャンセル</a>
            </div>
        </form>
    </main>
    <div th:replace="~{layout :: footer}"></div>
</body>

</html>
