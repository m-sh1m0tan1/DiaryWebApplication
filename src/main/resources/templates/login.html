<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Weekly Diary</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-page">
    <div th:replace="~{layout :: header}"></div>
    <main class="login-main" aria-labelledby="login-heading">
        <div class="login-intro">
            <h1 id="login-heading">今日のことを、少しだけ。</h1>
            <p>日記を開いて、今日を振り返りましょう。</p>
        </div>
        <section class="login-notebook" aria-labelledby="login-form-heading">
            <h2 id="login-form-heading">ログイン</h2>
            <p class="login-notice login-notice--error" th:if="${param.error}" role="alert">
                メールアドレスまたはパスワードが違います。入力内容を確認してください。
            </p>
            <p class="login-notice login-notice--success" th:if="${param.register}" role="status">
                登録が完了しました。ログインして日記を始めましょう。
            </p>
            <form class="login-form" th:action="@{/login}" method="post">
                <div class="login-field">
                    <label for="username">メールアドレス</label>
                    <input type="text" id="username" name="username" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
                <div class="login-field">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </div>
                <button type="submit">ログイン</button>
            </form>
            <div class="auth-navigation">
                <p>初めて使う方は</p>
                <a th:href="@{/register}">ユーザー登録</a>
            </div>
        </section>
    </main>
    <div th:replace="~{layout :: footer}"></div>
</body>

</html>
