<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/diary.css}">
</head>

<body>
    <header th:fragment="header" class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" th:href="@{/diary}">Weekly Diary</a>
            <form class="site-logout-form" th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="site-logout-button" type="submit">ログアウト</button>
            </form>
        </div>
    </header>

    <footer th:fragment="footer" class="site-footer">
        <div class="site-footer__inner">
            <small>© Weekly Diary</small>
        </div>
    </footer>
</body>

</html>
