<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 | Weekly Diary</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-page register-page">
    <div th:replace="~{layout :: header}"></div>
    <main class="login-main" aria-labelledby="register-heading">
        <div class="login-intro">
            <h1 id="register-heading">今日から、日記を。</h1>
            <p>登録すると、日記を書き始められます。</p>
        </div>
        <section class="login-notebook" aria-labelledby="register-form-heading">
            <h2 id="register-form-heading">ユーザー登録</h2>
            <form class="login-form" th:action="@{/register}" method="post" th:object="${userForm}">
                <div class="login-field">
                    <label for="name">ユーザー名</label>
                    <input type="text" id="name" th:field="*{name}" autocomplete="nickname">
                </div>
                <div class="login-field">
                    <label for="mail">メールアドレス</label>
                    <input type="text" id="mail" th:field="*{mail}" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">
                </div>
                <div class="login-field">
                    <label for="plainPassword">パスワード</label>
                    <input type="password" id="plainPassword" th:field="*{plainPassword}" autocomplete="new-password">
                </div>
                <button type="submit">登録する</button>
            </form>
            <div class="auth-navigation">
                <p>登録済みの方は</p>
                <a th:href="@{/login}">ログインへ戻る</a>
            </div>
        </section>
    </main>
    <div th:replace="~{layout :: footer}"></div>
</body>

</html>
