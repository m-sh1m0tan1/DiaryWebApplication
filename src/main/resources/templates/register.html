<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('ユーザー登録')"></head>

<body>
    <div th:replace="~{layout :: header}"></div>
        <form th:action="@{/register}" method="post" th:object="${userForm}">
            <input type="text" id="username" th:field="*{name}">
            <input type="text" id="mail" th:field="*{mail}">
            <input type="password" id="password" th:field="*{plainPassword}">
            <button type="submit">登録</button>
        </form>
    <div th:replace="~{layout :: footer}"></div>
</body>

</html>
