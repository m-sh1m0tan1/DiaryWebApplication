<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>
    <header th:fragment="header" class="site-header">
        <div class="site-header__inner">
            <p class="site-brand">Weekly Diary</p>
        </div>
    </header>

    <footer th:fragment="footer" class="site-footer">
        <div class="site-footer__inner">
            <small>© Weekly Diary</small>
        </div>
    </footer>
</body>

</html>
